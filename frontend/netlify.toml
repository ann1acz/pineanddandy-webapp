[build]
  command = "npm run build"
  # Relative to the base directory (frontend/)
  publish = "build/client"

[build.environment]
  # PORT and NODE_ENV are plain config values (, "production") that legitimately
  # appear in source and in the client bundle; they are not secrets. Real secrets
  # (Supabase keys, SESSION_SECRET, DATABASE_URL) remain scanned.
  SECRETS_SCAN_OMIT_KEYS = "PORT,NODE_ENV"

# SPA mode (ssr: false): serve index.html for client-side routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200