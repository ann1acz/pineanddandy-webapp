[build]
  base = "."
  command = "npm run build"
  publish = "frontend/build/client"

[build.environment]
  # Ignore non-secret config values without disabling credential scanning.
  SECRETS_SCAN_OMIT_KEYS = "PORT,NODE_ENV"

# SPA mode (ssr: false): serve index.html for client-side routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200