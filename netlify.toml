[build]
  base = "."
  command = "npm run build"
  publish = "frontend/build/client"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "PORT,NODE_ENV"

[[redirects]]
  from = "/api/*"
  to = "https://pineanddandy-webapp-api.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200